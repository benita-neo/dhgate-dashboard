name: Sync Feishu Data

on:
  schedule:
    # 01:00 UTC = 09:00 SGT — data fresh before AMs start their day
    - cron: "0 1 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install playwright pandas numpy

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Sync data from Feishu
        run: python dashboard/sync_data.py

      - name: Commit updated CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "chore: daily Feishu data sync $(date -u +%Y-%m-%d)"
          git push
